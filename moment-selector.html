<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moment Selector - AgentOS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        .info-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Moment Selector</h1>
        <div class="info-box" id="job-info"></div>
        <div id="moment-selector-container"></div>
    </div>

    <script type="module">
        import { MomentSelector } from './ui-v2/src/components/MomentSelector.js';

        // Get job ID from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('job') || '5b00cd73-d803-41a4-864c-3ed7b22b0321';

        console.log('Loading moment selector for job:', jobId);

        const container = document.getElementById('moment-selector-container');
        const jobInfo = document.getElementById('job-info');
        const apiBaseUrl = 'http://localhost:8001/api';

        jobInfo.innerHTML = `Job ID: <strong>${jobId}</strong>`;

        async function loadMomentSelector() {
            try {
                const selector = new MomentSelector(jobId, apiBaseUrl);
                const result = await selector.fetchMoments();

                if (!result.ready) {
                    container.innerHTML = `
                        <div style="background: white; padding: 40px; border-radius: 12px; text-align: center;">
                            <h2>⏳ Moments Not Ready Yet</h2>
                            <p>${result.message}</p>
                            <p style="margin-top: 20px;">
                                <a href="?job=${jobId}" style="color: #667eea; text-decoration: none; background: #eef2ff; padding: 10px 20px; border-radius: 6px; display: inline-block;">
                                    🔄 Refresh
                                </a>
                            </p>
                        </div>
                    `;
                    return;
                }

                const selectorElement = selector.render();
                container.appendChild(selectorElement);

                console.log('✅ Moment selector loaded with', selector.moments.length, 'moments');
            } catch (error) {
                console.error('Error loading moment selector:', error);
                container.innerHTML = `
                    <div style="background: white; padding: 40px; border-radius: 12px; text-align: center;">
                        <h2>❌ Error Loading Moments</h2>
                        <p style="color: #dc2626; margin: 20px 0;">${error.message}</p>
                        <p style="margin-top: 20px;">
                            <a href="?job=${jobId}" style="color: #667eea; text-decoration: none; background: #eef2ff; padding: 10px 20px; border-radius: 6px; display: inline-block;">
                                🔄 Try Again
                            </a>
                        </p>
                    </div>
                `;
            }
        }

        loadMomentSelector();
    </script>
</body>
</html>
